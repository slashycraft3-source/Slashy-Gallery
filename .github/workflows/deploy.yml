
name: Deploy Slashy Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate gallery.json
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          folder = Path("images")
          allowed = {".jpg", ".jpeg", ".png", ".webp", ".gif", ".avif"}

          files = sorted(
              p.as_posix()
              for p in folder.iterdir()
              if p.is_file() and p.suffix.lower() in allowed
          ) if folder.exists() else []

          if len(files) > 100:
              raise SystemExit("Maximum 100 images allowed")

          Path("gallery.json").write_text(
              json.dumps({"images": files}, indent=2)
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        
